# IPA sin firmar para instalar por sideload (AltStore, SideStore, Sideloadly).
#
# Publicar en la App Store cuesta 99 $/año, así que aquí no se firma nada: el
# archivo se compila sin identidad de firma y quien lo instala lo firma con su
# propio Apple ID gratuito desde su ordenador. Ese es el único camino legítimo
# para poner la app en un iPhone sin pagar la cuota de desarrollador.
#
# Se ejecuta SÓLO a mano (Actions → iOS → Run workflow). Antes saltaba también
# con cada etiqueta vX.Y.Z, pero ahora las etiquetas son releases de Android:
# el canal principal es Google Play y iOS se compila cuando toca, no en cada
# versión. El .ipa acaba colgado de la release que corresponde a la versión de
# package.json, que se crea si todavía no existe: un archivo que sólo vive como
# artefacto de Actions caduca a los 90 días y no se puede enlazar desde el
# README.

name: iOS

on:
  workflow_dispatch:

jobs:
  ipa:
    # Compilar para iOS exige Xcode, o sea macOS. Los runners de macOS son
    # gratis en repositorios públicos.
    runs-on: macos-latest
    timeout-minutes: 90

    # Sólo para adjuntar el .ipa a la release cuando el disparador es una etiqueta.
    permissions:
      contents: write

    env:
      EXPO_NO_TELEMETRY: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # El proyecto es "managed": la carpeta ios/ no está en git y se genera
      # aquí a partir de app.json.
      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: ios

      - name: Archive without code signing
        run: |
          set -euo pipefail
          WORKSPACE="$(ls -d ios/*.xcworkspace | head -1)"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          echo "Workspace: $WORKSPACE — scheme: $SCHEME"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ZonaDron.xcarchive" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM=""

      # Un .ipa es un zip con la app dentro de una carpeta llamada Payload.
      # No hace falta xcodebuild -exportArchive, que sí exigiría firmar.
      - name: Package the app into an unsigned .ipa
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p "$RUNNER_TEMP/pack/Payload"
          cp -R "$RUNNER_TEMP/ZonaDron.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/pack/Payload/"
          cd "$RUNNER_TEMP/pack"
          zip -qry "$GITHUB_WORKSPACE/ZonaDron-$VERSION-unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE"
          ls -lh ZonaDron-*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ZonaDron-unsigned-ipa
          path: ZonaDron-*.ipa
          if-no-files-found: error

      # El artefacto de arriba sirve para probar una compilación suelta; la
      # release es la que enlaza el README, así que el .ipa tiene que acabar
      # ahí sí o sí. Si la etiqueta no existía todavía, la crea apuntando al
      # commit que se acaba de compilar.
      - name: Publish the .ipa in its release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./package.json').version")"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            echo "La release $TAG no existe: se crea."
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Zona Dron $TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" ZonaDron-*.ipa --clobber
          echo "IPA publicado en $TAG"
